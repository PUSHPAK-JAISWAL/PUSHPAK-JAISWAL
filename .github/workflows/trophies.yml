name: Update GitHub Profile Trophies Cache

on:
  schedule:
    # Runs daily at 00:00 UTC to refresh stats for the day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger at any time from GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate Trophies SVG with Deno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Clone the repository
          git clone --depth=1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy-engine
          cd /tmp/trophy-engine

          # 2. Run runner script to fetch data and write SVG directly
          deno run --allow-net --allow-env --allow-read --allow-write - << 'EOF'
          import { renderTrophy } from "./mod.ts";

          const username = "${{ github.repository_owner }}";
          const theme = "flat";

          try {
            console.log(`[Trophies] Generating SVG for user: ${username}...`);
            const svg = await renderTrophy(username, { theme });
            await Deno.writeTextFile("${{ github.workspace }}/profile-trophies.svg", svg);
            console.log("[Trophies] SVG generated successfully.");
          } catch (err) {
            console.error("[Trophies] Generation failed:", err);
            Deno.exit(1);
          }
          EOF

          cd "${GITHUB_WORKSPACE}"

          # 3. Validate output file
          if [ -f "profile-trophies.svg" ] && grep -q "<svg" profile-trophies.svg; then
            echo "[Trophies] Valid SVG received successfully ($(wc -c < profile-trophies.svg) bytes)."
          else
            echo "[Trophies] Error: Output does not contain a valid SVG."
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi
