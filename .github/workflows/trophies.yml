name: Update GitHub Profile Trophies Cache

on:
  schedule:
    # Runs daily at 00:00 UTC to refresh stats for the day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger at any time from GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Full Profile Trophies SVG from Generator
        env:
          SERVICE_URL: ${{ vars.TROPHY_SERVICE_URL || 'https://pushpak-jaiswal.github.io/github-profile-trophy-Github-pages' }}
        run: |
          echo "[Trophies] Requesting full trophy SVG from: ${SERVICE_URL}"
          
          # Remove trailing slash from URL if present
          CLEAN_URL="${SERVICE_URL%/}"

          # Fetch SVG from your GitHub Pages deployment
          curl -fsSL \
            "${CLEAN_URL}/?username=${{ github.repository_owner }}&theme=flat" \
            -o profile-trophies.svg

          # Verify that the returned file is valid SVG
          if grep -q "<svg" profile-trophies.svg; then
            echo "[Trophies] Valid SVG received successfully ($(wc -c < profile-trophies.svg) bytes)."
          else
            echo "[Trophies] Error: Did not receive valid SVG output."
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi
