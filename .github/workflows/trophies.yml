name: Update GitHub Profile Trophies Cache

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate Trophies SVG with Deno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Clone the generator repository
          git clone --depth=1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy-engine
          cd /tmp/trophy-engine

          # 2. Determine the entry file (server.ts or index.ts)
          ENTRY_FILE="index.ts"
          [ -f "server.ts" ] && ENTRY_FILE="server.ts"

          echo "[Trophies] Starting local Deno service using ${ENTRY_FILE}..."
          deno run --allow-net --allow-env --allow-read "$ENTRY_FILE" &
          SERVER_PID=$!

          # 3. Wait up to 30 seconds for local server to respond
          echo "[Trophies] Waiting for local server on port 8080..."
          for i in {1..30}; do
            if curl -s "http://localhost:8080/?username=${{ github.repository_owner }}" >/dev/null 2>&1; then
              echo "[Trophies] Server is ready."
              break
            fi
            sleep 1
          done

          # 4. Fetch the rendered SVG
          curl -fsSL "http://localhost:8080/?username=${{ github.repository_owner }}&theme=flat" -o "${GITHUB_WORKSPACE}/profile-trophies.svg"

          # 5. Clean up local background server
          kill $SERVER_PID 2>/dev/null || true

          cd "${GITHUB_WORKSPACE}"

          # 6. Validate SVG file
          if grep -q "<svg" profile-trophies.svg; then
            echo "[Trophies] Valid SVG received successfully ($(wc -c < profile-trophies.svg) bytes)."
          else
            echo "[Trophies] Error: Output does not contain a valid SVG."
            cat profile-trophies.svg
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi
