name: Update GitHub Profile Trophies Cache

on:
  schedule:
    # Runs daily at 00:00 UTC to refresh stats for the day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger at any time from GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate Trophies SVG with Deno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: 8080
        run: |
          # 1. Clone the generator repository
          git clone --depth=1 https://github.com/pushpak-jaiswal/github-profile-trophy-Github-pages.git /tmp/trophy-engine
          cd /tmp/trophy-engine

          # 2. Pre-cache dependencies
          deno cache main.ts

          # 3. Start local server in background
          echo "[Trophies] Launching local Deno service via main.ts..."
          deno run -A main.ts &
          SERVER_PID=$!

          # 4. Wait for server to bind and respond on port 8080
          echo "[Trophies] Waiting for server on http://localhost:8080..."
          for i in {1..30}; do
            if curl -s "http://localhost:8080/?username=${{ github.repository_owner }}" >/dev/null 2>&1; then
              echo "[Trophies] Server is ready."
              break
            fi
            sleep 1
          done

          # 5. Download the rendered SVG directly
          curl -fsSL "http://localhost:8080/?username=${{ github.repository_owner }}&theme=flat" -o "${GITHUB_WORKSPACE}/profile-trophies.svg"

          # 6. Stop background server
          kill $SERVER_PID 2>/dev/null || true

          cd "${GITHUB_WORKSPACE}"

          # 7. Validate output SVG file
          if [ -f "profile-trophies.svg" ] && grep -q "<svg" profile-trophies.svg; then
            echo "[Trophies] Valid SVG received successfully ($(wc -c < profile-trophies.svg) bytes)."
          else
            echo "[Trophies] Error: Output does not contain a valid SVG."
            cat profile-trophies.svg
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi
