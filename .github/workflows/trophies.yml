name: Update GitHub Profile Trophies Cache

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Trophies SVG Locally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clone the trophy engine into a temp directory
          git clone --depth=1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy-engine
          cd /tmp/trophy-engine
          npm install

          # Run the internal renderer directly via Node with your GITHUB_TOKEN
          node -e "
            const { getTrophy } = require('./dist/index.js');
            // Or if typescript source:
          " 2>/dev/null || true

          # Alternatively, use npx / CLI if configured in your fork:
          # If your fork 'github-profile-trophy-Github-pages' has a generation script, run:
          # npm run build && node ...
