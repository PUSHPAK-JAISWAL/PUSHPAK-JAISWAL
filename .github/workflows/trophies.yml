name: Update GitHub Profile Trophies Cache

on:
  schedule:
    # Runs daily at 00:00 UTC to refresh stats for the day
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Profile Trophies SVG
        run: |
          echo "[Trophies] Downloading trophy SVG..."
          
          # Retry up to 3 times in case of cold-start delay
          for i in {1..3}; do
            curl -fsSL \
              -A "Mozilla/5.0 (GitHubActions-CacheBot)" \
              "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=flat" \
              -o profile-trophies.svg && break || sleep 5
          done

          # Check that we received valid SVG markup
          if [ -f "profile-trophies.svg" ] && grep -q "<svg" profile-trophies.svg; then
            echo "[Trophies] Valid SVG received successfully ($(wc -c < profile-trophies.svg) bytes)."
          else
            echo "[Trophies] Error: Did not receive valid SVG output."
            cat profile-trophies.svg
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi
