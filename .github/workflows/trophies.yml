name: Update GitHub Profile Trophies Cache

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger at any time from Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Full Profile Trophies SVG from Generator
        run: |
          # Triggers our website service to generate the complete authentic SVG.
          # ${{ github.repository_owner }} automatically detects whoever owns the repo!
          curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ais-pre-pzpnl2gceqyoab43jfmmp6-631169130903.asia-east1.run.app/api?username=${{ github.repository_owner }}&theme=flat" \
            -o profile-trophies.svg

          # Verify that valid SVG was received
          if grep -q "<svg" profile-trophies.svg; then
            echo "Successfully generated full profile-trophies.svg ($(wc -c < profile-trophies.svg) bytes)."
          else
            echo "Error: Service did not return valid SVG."
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi
