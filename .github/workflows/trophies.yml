name: Update GitHub Profile Trophies Cache

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate Trophies SVG with Deno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clone the official trophy repository
          git clone --depth=1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy-engine
          cd /tmp/trophy-engine

          # Execute the entry script and output SVG to repository root
          deno run --allow-net --allow-env --allow-read src/index.ts \
            --username "${{ github.repository_owner }}" \
            --theme "flat" > "${GITHUB_WORKSPACE}/profile-trophies.svg"

          cd "${GITHUB_WORKSPACE}"

          # Verify that the output is valid SVG
          if grep -q "<svg" profile-trophies.svg; then
            echo "[Trophies] Valid SVG received successfully ($(wc -c < profile-trophies.svg) bytes)."
          else
            echo "[Trophies] Error: Output does not contain a valid SVG."
            cat profile-trophies.svg
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi
