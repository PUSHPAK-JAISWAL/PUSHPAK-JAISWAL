name: Update GitHub Profile Trophies Cache

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate Trophies via Local Runner Engine
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          PORT: 8080
        run: |
          git clone --depth=1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy-engine
          cd /tmp/trophy-engine

          deno cache main.ts

          # Start server locally inside the runner
          deno run -A main.ts &
          SERVER_PID=$!

          # Wait for runner's local port to open
          for i in {1..30}; do
            if curl -s "http://localhost:8080/" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Fetch the generated SVG from localhost
          curl -fsSL "http://localhost:8080/?username=${{ github.repository_owner }}&theme=flat" \
            -o "${GITHUB_WORKSPACE}/profile-trophies.svg"

          kill $SERVER_PID 2>/dev/null || true

          cd "${GITHUB_WORKSPACE}"
          if [ -f "profile-trophies.svg" ] && grep -q "<svg" profile-trophies.svg; then
            echo "Success! Profile trophies generated locally on runner."
          else
            echo "Failed to produce SVG output."
            exit 1
          fi

      - name: Commit and Push Cached Trophies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-trophies.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy stats today."
          else
            git commit -m "Auto-update profile trophies daily cache [skip ci]"
            git push
          fi